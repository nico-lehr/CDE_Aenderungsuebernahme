[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cde-aenderungsuebernahme"
version = "0.3.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ein xfail, der ploetzlich besteht (Fehler repariert), ist ROT -> Marker muss dann entfernt werden.
xfail_strict = true
markers = [
    "redteam: Red-Team-Test mit absichtlich erwartetem Fehler (xfail strict, Grund mit RT-Nummer und Besitzer)",
    "markierung_an: Test laeuft mit farbiger Excel-Markierung (markierung.aenderungen = farbe, ADR 0005); sonst ist sie aus",
    "legende_neu: Test laeuft mit der Standard-Legende (legende.modus aus config/farben.yaml, ADR 0006); sonst Modus alt",
    "schreiber_openpyxl: Test laeuft mit dem frueheren Schreiber openpyxl (anwenden.schreiber, ADR 0007); sonst patch",
]
