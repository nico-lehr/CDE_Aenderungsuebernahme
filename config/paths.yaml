# config/paths.yaml -- alle Pfade des Projekts (Regel 28: nichts hartcodiert).
# Relative Pfade gelten ab dem Projektordner. Umgebungsvariable CDE_DATA_ROOT
# ueberschreibt data_dir (z.B. fuer ein anderes Laufwerk).
data_dir: ./data
runs_dir: ./data/runs
frontend_dir: ./frontend
# Messwerkzeug (python -m src.cli messen). Beide Ordner liegen unter data/ und sind von Git ignoriert.
# paare_dir: je Korpus (entwicklung | ex_test | test) ein Ordner pro Paar mit aenderungen.pdf, vorher.xlsx, nachher.xlsx;
#            aeltere Korpora liegen unter paare_dir/archiv/ (siehe docs/paar_format.md)
# messung_dir: append-only Berichte (NNN_<korpus>/bericht.json + bericht.md), enthalten KEINE Textinhalte
paare_dir: ./data/paare
messung_dir: ./data/messung
# Layout-Profile (python -m src.cli profil ...): Vorschau-Datensaetze und Bestaetigungen, append-only (Regel 29),
# liegt unter data/ und ist von Git ignoriert. Siehe docs/adr/0003-layout-profile.md
profile_dir: ./data/profile
# Steckbrief (python -m src.cli steckbrief): Zahlen, Farbcodes und Formen eines Beispiel-Paars, KEIN Text (Regel 16).
# append-only (NNN_<name>/steckbrief.json + steckbrief.md), liegt unter data/ und ist von Git ignoriert.
steckbrief_dir: ./data/steckbrief
