# config/farben.yaml -- Wie Aenderungen im PDF erkannt werden.
# Legende (Stand Auftrag): blau = neu hinzugekommen, rot oder durchgestrichen = entfaellt.
legende:
  blau: neu          # neu | entfaellt | ignorieren
  rot: entfaellt
  durchgestrichen: entfaellt

# Schwellen in HSV (Farbton in Grad, Saettigung/Helligkeit 0..1).
# Mit dem Dashboard-Bereich "Farben im PDF" pruefen, ob echte PDFs passen.
farbton:
  blau: [185, 265]
  rot_bis: 18
  rot_ab: 335
text:
  min_saettigung: 0.35
  min_helligkeit: 0.25
hintergrund:            # farbig hinterlegte (hervorgehobene) Woerter
  aktiv: true
  min_saettigung: 0.15
  min_helligkeit: 0.40
  max_flaeche_anteil: 0.25   # groessere Flaechen sind Tabellen-/Seitenhintergruende

durchstreichung:
  aktiv: true
  band: [0.28, 0.72]         # Linie muss in diesem Hoehenband des Zeichens liegen
  min_abdeckung: 0.5         # Anteil der Zeichenbreite, den die Linie ueberdeckt
  max_linienstaerke_pt: 2.0
  max_breite_anteil: 0.6     # laengere Linien unter dem Text sind Trennlinien/Tabellenrahmen (gilt nur noch fuer Unterstreichungen)
  min_kreuz_anteil: 0.6      # R5: eine Linie im Durchstreich-Band zaehlt (unabhaengig von ihrer Laenge), wenn sie so viele der Zeichen unter ihr im Band kreuzt; sonst Hinweis linie_unklar
  kurve_max_hoehe_pt: 1.2    # R5: flache Kurven/Pfade bis zu dieser Hoehe sind Linienkandidaten
  wort_anteil: 0.6           # ab diesem Zeichenanteil gilt das Wort als durchgestrichen
  max_ueberstand_em: 1.0     # Linie ragt hoechstens so weit (in Schriftgroessen) ueber den Text hinaus; sonst Zierlinie
  hell_min_helligkeit: 0.6   # hellgraue Linien (neutral und heller als das) sind Zierlinien, keine Durchstreichung
  hell_max_saettigung: 0.1
  unterstreichung_band: [0.8, 1.3]   # Hoehenband (Anteil der Zeichenhoehe) einer Unterstreichung

annotationen:                # PDF-Kommentare (Hervorheben / Durchstreichen)
  aktiv: true

layout:
  zeilen_toleranz: 0.5       # Anteil der Schriftgroesse fuer "gleiche Zeile"
  wort_luecke: 0.18          # Luecke (Anteil Schriftgroesse) = Leerzeichen
  leerzeichen_min_luecke_em: 0.05   # R1: ein Leerzeichen-Zeichen trennt nur, wenn zwischen den Nachbarzeichen mindestens so viel Platz ist (sonst Phantom, z. B. LibreOffice an weichen Trennstellen)
  leerzeichen_em: 0.28       # R4: Breite eines Leerzeichens (Anteil Schriftgroesse) fuer "haette das Wort noch gepasst?"
  absatz_passt_toleranz_em: 0.5   # R4: so viel Platz (Schriftgroessen) muss UEBRIG bleiben, damit "haette gepasst" sicher ist; knapper -> absatzgrenze_unklar
  absatz_passt_min_zeilen: 3 # R4: so viele lange Zeilen (>= 5 Woerter) braucht die Seite, um den rechten Rand zu schaetzen
  hochzahl_faktor: 0.75      # R3: Zeichen kleiner als Faktor * Median der Zeile ...
  hochzahl_anhebung: 0.15    # R3: ... und mindestens so viele Schriftgroessen angehoben = Hochzahl (Fussnoten-Marke), nicht im Wort-Text
  hochzahl_max_zeichen: 6    # R3: hoechstens so viele Zeichen hat eine allein stehende Hochzahl-Gruppe
  absatz_faktor: 1.3         # Zeilenabstand > Faktor * typischer Zeilenabstand => neuer Absatz
  ueberschrift_faktor: 1.08  # Schrift groesser als Fliesstext => Ueberschrift
  kopf_fuss_anteil: 0.07     # oberer/unterer Seitenrand fuer Kopf-/Fusszeilen
  kopf_fuss_abstand_em: 1.5  # Randzeile (ganz im Seitenrand) ohne Wiederholungsmuster ist Kopf-/Fusszeile, wenn sie so weit (Schriftgroessen) vom Text abgesetzt steht
  kopf_fuss_max_schrift: 1.15  # ... und nicht groesser als Fliesstext * Faktor ist
  silbentrennung_zusammenfuegen: true
  keine_silbentrennung_vor: [und, oder, bzw, sowie, bis, to, and, or]
  silbentrennung_min_buchstaben: 2   # so viele Buchstaben muss das Stueck vor dem Trennstrich haben (auch beim unsichtbaren weichen Strich)

flaechen:                    # gefuellte Rechtecke hinter Text: Markierung oder Gestaltung (Tabellenkopf, Baenderung)?
  max_ueberstand_em: 1.0     # eine Markierung ragt hoechstens so weit (in Schriftgroessen) ueber den Text hinaus
  max_hoehe_zeilen: 3.5      # hoeher als so viele Zeilen: Kasten, keine Markierung
  min_fuellgrad: 0.45        # Anteil der Flaeche, den der Text belegt (Tabellenkopf: viel Leerraum)

unbekannt:                   # kraeftig gefaerbter Text, der keiner Legende zugeordnet ist -> Luecke "unbekannte_farbe"
  aktiv: true
  min_saettigung: 0.35       # bunte Farben (Gruen, Orange, Cyan, Violett, Dunkelblau ...)
  min_helligkeit: 0.10       # darunter gilt eine Farbe als Schwarz
  pastell_min_saettigung: 0.15   # blasse Farben (Pastellrot ...)
  pastell_min_helligkeit: 0.55
  grau_min_helligkeit: 0.25  # mittleres Grau neben schwarzem Fliesstext
  grau_max_helligkeit: 0.75
  grundfarbe_anteil: 0.5     # Farbe mit mehr als diesem Zeichenanteil ist die Grundfarbe des Dokuments (keine Markierung)

seiten:                      # Scan-Seiten, Bilder, Zeichnungen
  bild_seite_anteil: 0.5     # Bilder bedecken mindestens so viel der Seite -> Bildseite (Scan)
  bild_seite_max_woerter: 20 # sichtbarer Text auf einer Bildseite (ohne Kopf-/Fusszeile) hoechstens so viele Woerter
  bild_min_flaeche_anteil: 0.02   # kleinere Bilder (Logos, Symbole) sind keine Luecke
  grafik_min_objekte: 20     # Seite ohne Text, aber mit so vielen Linien/Flaechen: Zeichnung statt leere Seite
  max_linien: 400            # mehr Linien auf einer Seite: Zeichnung statt Tabelle

spalten:                     # mehrere Textspalten nebeneinander
  min_luecke_em: 1.5         # Luecke zwischen zwei Woertern (in Schriftgroessen), die als Spaltenzwischenraum zaehlt
  min_zeilen_luecke: 2       # so viele Zeilen mit derselben Luecke an derselben Stelle -> Spalten/Tabelle
  min_zeilen: 3              # so viele Abschnitte links und rechts einer zweiten Spalte (Spalten auf verschiedener Hoehe)
  min_spaltenabstand_em: 1.0 # Mindestabstand zwischen linker Spalte und Beginn der rechten (in Schriftgroessen)
  min_anteil: 0.4            # Verhaeltnis der Zeilenzahlen links/rechts (kleinere / groessere Spalte)
  min_ueberlappung: 0.5      # so viel der Spaltenhoehe muss in beiden Spalten gleichzeitig vorkommen

tabellen:                    # Tabellen mit Rahmenlinien
  linie_min_laenge: 20       # waagerechte Linien ab dieser Laenge (pt)
  linie_min_hoehe: 8         # senkrechte Linien ab dieser Hoehe (pt)
  min_zellen: 2              # so viele Zellen (Zeilen x Spalten) ergeben eine Tabelle
  toleranz: 2.0              # Abstand (pt), bis zu dem sich Linien beruehren

ueberschriften_design:       # alle Ueberschriften blau = Gestaltung, nicht "neu"
  min_anzahl: 3              # so viele Ueberschriften muessen vorhanden sein
  max_anteil_text: 0.5       # Anteil markierter Woerter im uebrigen Text, bis zu dem das als Gestaltung gilt

sicht:                       # Schema 3 / ADR 0004: zweiter Leser (pdfium) und Farb-Inventur (src/sicht.py); Welle 2
  aktiv: false
