# config/layouts.yaml -- VORLAGE fuer Layout-Profile (eingecheckt, nur erfundene Beispiele, Regel 16).
#
# Wozu: Die Erkennung des Excel-Aufbaus (Section-/Titel-/Inhaltsspalte, Modell) ist eine Heuristik. Ist sie unsicher
# oder falsch, legst du den Aufbau hier je Blatt von Hand fest.
#
# ECHTE Profile (echte Blatt- und Spaltennamen) gehoeren NICHT in diese Datei, sondern in
#   config/layouts.local.yaml     (gleiches Format; wird von Git ignoriert)
#
# Ein Profil geht nie direkt live. Ablauf (Details: docs/adr/0003-layout-profile.md):
#   1. Profil in die Datei schreiben und  aktiv: true  setzen.
#   2. python -m src.cli profil vorschau --excel MEINE.xlsx --profil NAME     (zeigt den Aufbau, keine Zellinhalte)
#   3. Stimmt die Vorschau:  python -m src.cli profil bestaetigen --vorschau <ID aus Schritt 2>
#   4. Erst jetzt nimmt der Analyse-Lauf das Profil an. Aendert sich der Inhalt des Profils (ausser aktiv/beschreibung),
#      ist die Bestaetigung ungueltig: neue Vorschau und neue Bestaetigung noetig.
#   Zurueck nehmen: aktiv: false  (nichts wird geloescht).
#
# Aufbau:
#   profile:
#     - name: eindeutiger Name (ueber beide Dateien)
#       aktiv: false                    # true = darf nach der Bestaetigung benutzt werden (Standard: false)
#       beschreibung: freier Text       # optional, aendert den Hash nicht
#       erkennung:                      # optional; nur ein VORSCHLAG in "profil vorschau" ohne --profil, nie stilles Anwenden
#         blattnamen: ["Name1"]         #   diese Blaetter muessen vorkommen (Gross-/Kleinschreibung egal)
#         kopfzeilen_begriffe: ["nr"]   #   diese Woerter stehen in der ersten Zeile (der genannten Blaetter)
#       blaetter:                       # eine Liste; jedes Blatt hoechstens einmal
#         - blatt: "Blattname"
#           ignorieren: true            # dieses Blatt wird nie abgeglichen (dann keine weiteren Angaben)
#         - blatt: "Blattname 2"
#           section_spalte: "A"         # Spalte mit den Gliederungsnummern (1, 2.1, ...); optional
#           titel_spalte: "B"           # Spalte mit der Ueberschrift neben der Nummer; optional
#           inhalt_spalte: "C"          # Spalte mit dem Anforderungstext; Pflicht
#           modell: zeile_pro_section   # zeile_pro_section | zeile_pro_absatz | register; Pflicht
#           kopfzeile: 1                # Zeilennummer der Spaltenueberschriften (0 oder weglassen = keine)
#
# CDE-Register (ADR 0006 Punkt 5): eine Zeile je Absatz/Listenpunkt, die Section-Nummer steht in JEDER Zeile, die Listennummer
# steht im Text (mit Tab oder geschuetzten Leerzeichen), Sub-Section-Buchstaben (A, B ... AA) in einer eigenen Spalte,
# Ueberschriftzeilen tragen ein festes Kennwort. Wird meist automatisch erkannt; sonst so festlegen:
#           modell: register            # = zeile_pro_absatz mit diesen Zusatzrollen (keine titel_spalte: der Titel steht im Text)
#           section_spalte: "E"         # "1.1", "Part 1" (Pflicht)
#           inhalt_spalte: "G"          # Text mit Listennummer (Pflicht)
#           untergliederung_spalte: "F" # Sub-Section-Buchstabe; optional
#           kennwort_spalte: "I"        # Kennwort der Ueberschriftzeilen (der haeufigste Wert dort gilt); optional
#           kopfzeile: 6                # Zeile der Spaltenkoepfe; darunter koennen Beispielzeilen stehen
#           daten_ab: 8                 # erste Datenzeile; 0 oder weglassen = erste Zeile mit Gliederungswert unter der Kopfzeile
#
# Spaltenbuchstaben immer in Anfuehrungszeichen ("C"): sonst liest YAML z. B. NO oder ON als "nein"/"an".
# Blattnamen muessen genau so geschrieben sein wie in Excel.

profile:
  - name: beispiel_anforderungsliste     # ERFUNDEN: so sieht ein Profil aus
    aktiv: false                         # Vorlage: wird nie benutzt, solange hier false steht
    beschreibung: >
      Erfundenes Beispiel: Ein Blatt "Anforderungen" mit Nummer in A, Titel in B und Text in C
      (eine Zeile je Section) und ein Deckblatt, das nie angefasst wird.
    erkennung:
      blattnamen: ["Anforderungen", "Deckblatt"]
      kopfzeilen_begriffe: ["nr", "titel", "inhalt"]
    blaetter:
      - blatt: "Deckblatt"
        ignorieren: true
      - blatt: "Anforderungen"
        section_spalte: "A"
        titel_spalte: "B"
        inhalt_spalte: "C"
        modell: zeile_pro_section
        kopfzeile: 1

  - name: beispiel_cde_register            # ERFUNDEN: ein CDE-Register (ADR 0006), falls die automatische Erkennung danebenliegt
    aktiv: false
    beschreibung: >
      Erfundenes Beispiel: Hauptblatt "Register" mit Kopfbereich, Spaltenkoepfen in Zeile 6, Beispielzeile 7 und Daten ab
      Zeile 8; Section in E, Sub-Section in F, Text in G, Kennwort der Ueberschriftzeilen in I. Die Nebenblaetter werden
      ignoriert.
    blaetter:
      - blatt: "Hinweise"
        ignorieren: true
      - blatt: "Register"
        section_spalte: "E"
        inhalt_spalte: "G"
        untergliederung_spalte: "F"
        kennwort_spalte: "I"
        modell: register
        kopfzeile: 6
        daten_ab: 8
