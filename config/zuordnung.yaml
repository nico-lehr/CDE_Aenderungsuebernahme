# config/zuordnung.yaml -- Wie Aenderungen in der Excel gefunden und eingetragen werden.
schwellen:
  hoch: 0.90          # ab hier wird automatisch uebernommen (Konfidenz "hoch")
  mittel: 0.65        # darunter bis hier: Vorschlag, Mensch bestaetigt ("pruefen")
  eindeutig_abstand: 0.08   # zweitbester Treffer muss mindestens so viel schlechter sein
  kurz_tokens: 4      # Bloecke mit <= so vielen Woertern brauchen passende Section
kandidaten_pro_block: 10

excel:
  min_inhalt_zeichen: 25      # ab so vielen Zeichen gilt eine Zelle als Inhaltstext
  section_spalte_min: 2       # mindestens so viele Nummern, damit eine Spalte "Section" ist
  modell_schwelle: 0.6        # Anteil Kopfzeilen mit Inhalt in der Zeile => "zeile_pro_section", sonst "zeile_pro_absatz"
  titel_max_zeichen: 160      # laengere Zellen gelten nicht als Titel
  kopf_max_woerter: 12        # Zelle "1. Das System ..." mit mehr Woertern (oder Satzpunkt am Ende) ist eine Aufzaehlung, keine Section
  titel_fliesstext_anteil: 0.5  # Spalte neben der Nummer, deren Zellen in Folgezeilen zu mehr als diesem Anteil lang sind, ist Fliesstext, kein Titel
  inhalt_zweifel_anteil: 0.5  # zweite Textspalte mit mindestens so viel Text wie die erste => Aufbau unsicher
  gemischt_anteil: 0.25       # Text steht zu mindestens so viel Anteil in Section-Zeilen UND in Folgezeilen => Aufbau unsicher
  lfd_min: 3                  # Spalte 1, 2, 3 ... ohne Punkte gilt ab so vielen Zeilen als laufende Nummer
  warn_ab_zellen: 6           # Blaetter ohne erkennbare Gliederung werden erst ab so vielen Textzellen gemeldet
  lfd_kopfwoerter: [lfd, laufende, pos, position, index]               # Spaltenkoepfe, die eine laufende Nummer bedeuten
  kommentar_kopfwoerter: [kommentar, bemerkung, anmerkung, notiz, hinweis, status, prio, priorität, comment, remark, note]
  section_kopfwoerter: [nr, nummer, kapitel, section, abschnitt, gliederung, ziffer]

einfuegen:
  neuer_absatz: auto          # auto | zelle | zeile
  # Hinweis: Eine neue Section wird immer als neue Zeile eingefuegt. Die frühere Einstellung "neue_section"
  # wurde nie gelesen und ist entfernt (Regel 1: nichts anbieten, was nicht wirkt).
geloeschtes:
  inhalt: leeren              # leeren | zeile_entfernen
markierung:
  geaenderte_zellen: keine    # keine | kommentar | gelb

planer:                       # Planen und Anwenden (src/planner.py, src/applier.py)
  # Zeichen, die beim Lesen eines PDF oft verfaelscht werden (Ligaturen, Ersatzzeichen): Neutext damit wird nie automatisch uebernommen
  verdaechtige_zeichen: ["\uFB00", "\uFB01", "\uFB02", "\uFB03", "\uFB04", "\uFB05", "\uFB06", "\uFFFD"]
  verdaechtige_muster: ['\(cid:\d+\)']   # kaputte PDF-Schrift: "(cid:12)"
  # Silbentrennung am Zeilenende, die nicht zusammengefuegt wurde: "Netzanschlussbe- dingungen" (Trennstrich, Leerzeichen,
  # Kleinbuchstabe). Neutext damit wird nie automatisch uebernommen. Echte Bindestriche ("kWh-Zaehler") haben kein Leerzeichen;
  # "Ein- und Ausgang" (Ergaenzungsstrich) ist erlaubt: das Wort nach dem Strich steht dann in den Ausnahmen.
  trennmuster: ['(?<=\w)[-\u00ad\u2010\u2011][ \t\u00a0]+(?P<rest>[a-zäöüß]\w*)']
  trennung_ausnahmen: [und, oder, bzw, sowie, bis, beziehungsweise, als, wie, noch, and, or]
  # Tabellen-Text mit senkrechten Strichen als Spaltentrenner ("Pos. | Bauteil | Menge"): nie automatisch uebernehmen
  tabellen_muster: ['(?:^|\s)\|(?:\s|$)']
  tabellen_min_treffer: 1     # so viele Spaltentrenner im Neutext genuegen
  # Absatz-Sperre (ADR 0004, geschlossene Liste): steht einer dieser Hinweis-Codes an IRGENDEINEM Wort des Absatzes (nicht nur
  # an den geaenderten), wird keine Aenderung dieses Absatzes automatisch eingetragen ("pruefen", Code "sperre:<code>").
  # "kommentar" gilt fuer alle kommentar_* (PDF-Kommentare). fortsetzung_unklar setzt der Planer selbst (Seitenumbruch).
  unsichere_hinweise: [unbekannte_farbe, teilweise_markiert, gemischt_blau_strich, gemischt_widerspruch, linie_unklar,
                       kommentar, tabelle, mehrspaltig, design_flaeche, farbe_uneinig, tinte_unerklaert,
                       fortsetzung_unklar, absatzgrenze_unklar, trennung_unklar, rand_unklar, hochzahl_markiert,
                       linienfarbe_unklar]
  # Nur Hinweis (keine Sperre): der Satz zum Code steht bei den Aenderungen des Absatzes
  hinweis_codes: [link, unterstrichen, design_blau, ligatur]
  # Ohne Angabe des PDF-Lesers (PdfBlock.fortsetzung) raten, ob ein Absatz ueber den Seitenumbruch weitergeht: letzter Block
  # einer Seite ohne Satzende + erster Block der naechsten Seite = "moeglich" (verbunden nur, wenn A1 es bestaetigt; ganz
  # neuer Text danach -> fortsetzung_unklar, nie automatisch). Wird nur benutzt, wenn KEIN Block eine Angabe hat. Aus, seit der
  # PDF-Leser die Angabe selbst macht ("sicher" | "moeglich"); nur fuer aeltere Leser gedacht.
  fortsetzung_raten: false
  satzende_zeichen: ".!?:;"
  doppelt_min_woerter: 3      # Ab so vielen Woertern gilt "gleicher Absatz steht schon" als sicher (nicht uebernommen); kuerzer = nur Vorschlag

# --- Schema 2: bisher im Code fest eingebaute Werte (Verhalten unveraendert; werden von K-XL / K-PL verdrahtet) ---
matcher:                      # Bewertung eines Treffers (src/matcher.py)
  gewicht_abdeckung: 0.9      # score = gewicht_abdeckung * Abdeckung + gewicht_dice * Dice
  gewicht_dice: 0.1
  section_bonus: 0.03         # Zuschlag, wenn die Section-Nummer passt
  untergrenze: 0.4            # darunter gibt es keinen Treffer, auch keinen Vorschlag
  max_kandidaten_section: 400 # so viele Kandidaten derselben Section werden zusaetzlich geprueft
  excel_abdeckung_min: 0.75   # deckt der PDF-Text weniger als so viel vom Excel-Absatz ab (Rest >= rest_min_woerter), nur "mittel"
  section_unpassend_stufe: mittel   # Stufe, wenn PDF-Section (alte Nummer) und Excel-Section beide bekannt sind und nicht passen (hoch | mittel)
  rest_min_woerter: 5         # so viele Woerter des Excel-Absatzes muessen unabgedeckt sein, damit der Anfangs-Treffer zaehlt
  teil_min_woerter: 3         # ExaktIndex: Teilstueck eines laengeren Excel-Absatzes (Seitenumbruch) erst ab so vielen Woertern
anwenden:                     # Schreiben in die Excel (src/applier.py)
  markierung_farbe: FFF2CC    # Hintergrund, wenn markierung.geaenderte_zellen = gelb
  kommentar_autor: CDE-Tool   # Autor der Zellkommentare, wenn markierung.geaenderte_zellen = kommentar
  gegenprobe_pflicht: true    # ADR 0004 Invariante: automatische Text-Aenderung ohne PDF-Absatz (plan.absaetze) -> "pruefen"
                              # (Code ohne_absatz). Neue Absaetze in einer Zelle und neue Zeilen sind ausgenommen.

# --- Schema 3 / ADR 0004: Gegenprobe ---------------------------------------------------------------
normalform:                   # Vergleichsform "streng, aber fair" (src/gegenprobe.py): Gross/Klein und Satzzeichen zaehlen
  # Zeichen, die beim Vergleich ganz wegfallen: weiches Trennzeichen, Nullbreiten, Hochzahlen (Fussnoten-Marken)
  entfernen: ["­", "​", "‌", "‍", "⁠", "﻿",
              "¹", "²", "³", "⁰", "⁴", "⁵", "⁶", "⁷", "⁸", "⁹"]
  # Varianten, die als gleich gelten (Anfuehrungszeichen, Striche)
  ersetzen: {"„": "\"", "“": "\"", "”": "\"", "«": "\"", "»": "\"",
             "‚": "'", "‘": "'", "’": "'", "‹": "'", "›": "'",
             "‐": "-", "‑": "-", "‒": "-", "–": "-", "—": "-", "―": "-", "−": "-"}
  leerraum: [" ", " ", " ", " ", "\t", "\n", "\r"]   # zaehlen als ein Leerzeichen
  kein_leerzeichen_vor: ".,;:!?)]}"
  kein_leerzeichen_nach: "([{"
  listenzeichen: ["•", "·", "▪", "◦", "‣", "-", "*"]   # optionales Aufzaehlungszeichen am Absatzanfang

neue_zeile:                   # Etappe 2 (src/zeilen.py): neue Zeile "wie ein Mensch" aus der Nachbarzeile gleichen Typs
  konstanten_kopieren: true   # Spalten mit immer gleichem Wert (z. B. "Status offen") uebernehmen (Entscheidung Nico)
zeilen:
  listen_summen_erweitern: true   # SUMME/ANZAHL ueber den ganzen Datenblock waechst mit neuen Zeilen mit (mit Hinweis)
