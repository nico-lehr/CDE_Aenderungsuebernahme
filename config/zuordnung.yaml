# config/zuordnung.yaml -- Wie Aenderungen in der Excel gefunden und eingetragen werden.
schwellen:
  hoch: 0.90          # ab hier wird automatisch uebernommen (Konfidenz "hoch")
  mittel: 0.65        # darunter bis hier: Vorschlag, Mensch bestaetigt ("pruefen")
  eindeutig_abstand: 0.08   # zweitbester Treffer muss mindestens so viel schlechter sein
  kurz_tokens: 4      # Bloecke mit <= so vielen Woertern brauchen passende Section
kandidaten_pro_block: 10

excel:
  min_inhalt_zeichen: 25      # ab so vielen Zeichen gilt eine Zelle als Inhaltstext
  section_spalte_min: 2       # mindestens so viele Nummern, damit eine Spalte "Section" ist
  modell_schwelle: 0.6        # Anteil Kopfzeilen mit Inhalt in der Zeile => "zeile_pro_section", sonst "zeile_pro_absatz"
  titel_max_zeichen: 160      # laengere Zellen gelten nicht als Titel
  kopf_max_woerter: 12        # Zelle "1. Das System ..." mit mehr Woertern (oder Satzpunkt am Ende) ist eine Aufzaehlung, keine Section
  titel_fliesstext_anteil: 0.5  # Spalte neben der Nummer, deren Zellen in Folgezeilen zu mehr als diesem Anteil lang sind, ist Fliesstext, kein Titel
  inhalt_zweifel_anteil: 0.5  # zweite Textspalte mit mindestens so viel Text wie die erste => Aufbau unsicher
  gemischt_anteil: 0.25       # Text steht zu mindestens so viel Anteil in Section-Zeilen UND in Folgezeilen => Aufbau unsicher
  lfd_min: 3                  # Spalte 1, 2, 3 ... ohne Punkte gilt ab so vielen Zeilen als laufende Nummer
  warn_ab_zellen: 6           # Blaetter ohne erkennbare Gliederung werden erst ab so vielen Textzellen gemeldet
  lfd_kopfwoerter: [lfd, laufende, pos, position, index]               # Spaltenkoepfe, die eine laufende Nummer bedeuten
  kommentar_kopfwoerter: [kommentar, bemerkung, anmerkung, notiz, hinweis, status, prio, priorität, comment, remark, note]
  section_kopfwoerter: [nr, nummer, kapitel, section, abschnitt, gliederung, ziffer]
  # ADR 0006 Punkt 5: CDE-Register (Kopfbereich, Kopfzeile, Beispielzeile, dann EINE Zeile je Absatz/Listenpunkt). Erkannt nur
  # aus der Struktur (src/excel_model.py _register_erkennen), nie aus Spalten- oder Blattnamen. Profil: modell register.
  register:
    aktiv: true
    min_zeilen: 6               # mindestens so viele Datenzeilen mit Gliederungswert in derselben Spalte ...
    wiederholung_min: 1.5       # ... und im Mittel so viele Zeilen je Gliederungswert (die Nummer steht in JEDER Zeile)
    section_muster: '^[1-9]\d{0,2}(?:\.\d{1,3}){0,6}$'   # "1.1" (Leerzeichen am Rand egal; "0" ist ein Platzhalter)
    kapitel_muster: '^(?:part|teil)\s*(\d{1,2})$'        # "Part 1" (Gross/Klein egal)
    kapitel_name: 'Part {n}'    # einheitlicher Name, wie der PDF-Leser ihn bildet (farben.yaml layout.section_kapitel_name)
    untergliederung_muster: '^[A-Z]{1,2}$'               # Sub-Section A ... Z, AA, BB ...
    untergliederung_min: 2      # Sub-Section-Spalte: mindestens so viele Buchstaben, darunter "A", mindestens zwei verschiedene ...
    untergliederung_folge_min: 0.9   # ... und so viele Schritte in Folge (gleich oder weiter, je Section neu ab A)
    kopf_min_zellen: 3          # Kopfzeile: mindestens so viele kurze Textkoepfe ...
    kopf_max_zeichen: 40        # ... mit hoechstens so vielen Zeichen
    kopf_suche_zeilen: 4        # die Kopfzeile steht hoechstens so weit ueber der ersten Datenzeile (dazwischen: Beispielzeilen)
    kennwort_max_zeichen: 40    # Kennwort der Ueberschriftzeilen: ein kurzer Wert ...
    kennwort_min_zeilen: 2      # ... in mindestens so vielen Zeilen, nur neben kurzem (titel_max_zeichen) oder fettem Text ...
    kennwort_max_anteil: 0.8    # ... in hoechstens diesem Anteil der Datenzeilen (Konstanten stehen in fast allen Zeilen) ...
    kennwort_min_fett: 0.5      # ... und mindestens so viele dieser Zeilen haben fetten Text (Ueberschriften)
    # Listennummer + Polster (Tab, geschuetzte Leerzeichen, Leerzeichen) am Anfang des Texts; Listenpunkt <-> Text mit gleicher Nummer
    listen_label: '^(?P<label>\d{1,3}[.)]|[a-z]{1,3}[.)]|[A-Z]{1,3}[.)]|[ivxlcdm]{1,6}[.)])(?P<polster>[\t    ]+)(?=\S)'
    polster_standard: "\t"      # Polster einer neuen Listennummer, wenn keine Zeile mit gleicher Art Listennummer eines zeigt
    vorlage_kandidaten: 8       # Vorlagezeile einer neuen Zeile: unter so vielen naechsten Zeilen gleichen Typs hat die erste den Vorrang, deren
                                # Konstanten links der Section-Spalte so geschrieben sind wie in den meisten Zeilen der Spec (kein verirrtes Leerzeichen)
    # Spec-Filter (Welle 3, Nico: eine CDE enthaelt mehrere Specs): Spalte mit der Spezifikationsnummer je Zeile. Ziffergruppen
    # mit Leerzeichen/Unterstrich/Punkt/Bindestrich ("11 22 33" = "11_22_33"), Zusaetze dahinter egal
    spec_muster: '(?<![\d])(\d{2})[ _.\-](\d{2})[ _.\-](\d{2})(?:[ _.\-](\d{2}))?(?![\d])'
    spec_min_anteil: 0.8        # so viele Werte der Spalte (Datenzeilen) muessen spec-artig sein

einfuegen:
  neuer_absatz: auto          # auto | zelle | zeile
  # Hinweis: Eine neue Section wird immer als neue Zeile eingefuegt. Die frühere Einstellung "neue_section"
  # wurde nie gelesen und ist entfernt (Regel 1: nichts anbieten, was nicht wirkt).
geloeschtes:
  inhalt: leeren              # leeren | zeile_entfernen
markierung:
  geaenderte_zellen: keine    # keine | kommentar | gelb (kommentar/gelb nur mit anwenden.schreiber = openpyxl)
  # ADR 0005: Aenderungen in der Excel wie im PDF markieren. farbe = neuer Inhalt rot, alter Inhalt blau + durchgestrichen
  # (Alt direkt vor Neu in derselben Zelle); keine = bisheriges Verhalten (alter Text wird ersetzt/geleert).
  aenderungen: farbe          # farbe | keine
  neu_farbe: FFFF0000         # Schriftfarbe fuer neuen Inhalt (ARGB); bestaetigt an Nicos echten Beispielen (ADR 0005, Nachtrag 18.10.)
  alt_farbe: FF00B0F0         # Schriftfarbe fuer alten Inhalt (Excel "Hellblau"), zusaetzlich durchgestrichen
  trenner: ""                 # zwischen Alt und Neu: nichts extra, Reihenfolge und Leerzeichen genau wie im PDF (Nico, 18.10.)
  geloeschte_section: markieren   # markieren (Zeile bleibt, Inhalt blau + durchgestrichen) | zeile_entfernen (nur Schreiber openpyxl)

planer:                       # Planen und Anwenden (src/planner.py, src/applier.py)
  # Zeichen, die beim Lesen eines PDF oft verfaelscht werden (Ligaturen, Ersatzzeichen): Neutext damit wird nie automatisch uebernommen
  verdaechtige_zeichen: ["\uFB00", "\uFB01", "\uFB02", "\uFB03", "\uFB04", "\uFB05", "\uFB06", "\uFFFD"]
  verdaechtige_muster: ['\(cid:\d+\)']   # kaputte PDF-Schrift: "(cid:12)"
  # Silbentrennung am Zeilenende, die nicht zusammengefuegt wurde: "Netzanschlussbe- dingungen" (Trennstrich, Leerzeichen,
  # Kleinbuchstabe). Neutext damit wird nie automatisch uebernommen. Echte Bindestriche ("kWh-Zaehler") haben kein Leerzeichen;
  # "Ein- und Ausgang" (Ergaenzungsstrich) ist erlaubt: das Wort nach dem Strich steht dann in den Ausnahmen.
  trennmuster: ['(?<=\w)[-\u00ad\u2010\u2011][ \t\u00a0]+(?P<rest>[a-zäöüß]\w*)']
  trennung_ausnahmen: [und, oder, bzw, sowie, bis, beziehungsweise, als, wie, noch, and, or]
  # Tabellen-Text mit senkrechten Strichen als Spaltentrenner ("Pos. | Bauteil | Menge"): nie automatisch uebernehmen
  tabellen_muster: ['(?:^|\s)\|(?:\s|$)']
  tabellen_min_treffer: 1     # so viele Spaltentrenner im Neutext genuegen
  # Absatz-Sperre (ADR 0004, geschlossene Liste): steht einer dieser Hinweis-Codes an IRGENDEINEM Wort des Absatzes (nicht nur
  # an den geaenderten), wird keine Aenderung dieses Absatzes automatisch eingetragen ("pruefen", Code "sperre:<code>").
  # "kommentar" gilt fuer alle kommentar_* (PDF-Kommentare). fortsetzung_unklar setzt der Planer selbst (Seitenumbruch).
  unsichere_hinweise: [unbekannte_farbe, teilweise_markiert, gemischt_blau_strich, gemischt_widerspruch, linie_unklar,
                       kommentar, tabelle, mehrspaltig, design_flaeche, farbe_uneinig, tinte_unerklaert,
                       fortsetzung_unklar, absatzgrenze_unklar, trennung_unklar, rand_unklar, hochzahl_markiert,
                       linienfarbe_unklar]
  # Nur Hinweis (keine Sperre): der Satz zum Code steht bei den Aenderungen des Absatzes
  hinweis_codes: [link, unterstrichen, design_blau, ligatur, farbe_ohne_linie, hinterlegt]
  # Auftrag 004 (Vorschlaege): Bei diesen Sperren gibt es KEINEN fertigen Vorschlag, die Aenderung steht mit Grund bei "nicht
  # uebernommen". Gemessen an erfundenen Paaren (nachbau_word): nach Freigabe war der Vorschlag bei fortsetzung_unklar nur in
  # 1 von 10 Faellen richtig (der Absatz ging ueber den Seitenumbruch weiter, der Vorschlag legte eine neue Zeile an).
  sperren_ohne_vorschlag: [fortsetzung_unklar]
  # Vorschlaege bei abweichender Excel (excel_weicht_ab): false = nur zeichengenau (Normalform-Ausrichtung, wie Word markiert);
  # true = auch der alte Matcher Wort fuer Wort (ersetzt ganze Woerter samt Satzzeichen, liest Leerraum an der Naht anders)
  vorschlag_wortgenau: false
  # ADR 0006 Punkt 6, Bereich der CDE: PDF-Absaetze vor dem ersten bzw. nach dem letzten sicheren Anker im Hauptblatt (Blatt mit
  # den meisten Ankern) gehoeren nicht zur CDE (Deckblatt, Vorspann, Revisionstabelle, Anhang): Aenderung.bereich = ausserhalb,
  # nicht uebernommen, kein offener Punkt, zaehlt in der Bilanz. register = nur wenn das Hauptblatt ein CDE-Register ist | immer | aus
  umfang: register
  umfang_min_anker: 5         # erst ab so vielen sicheren Ankern im Hauptblatt (sonst wie bisher)
  # Spec-Filter (Welle 3): Spezifikationsnummer des PDFs. Sicher ist sie aus der Titelzeile ("SECTION 11 22 33 ...") oder der
  # wiederkehrenden Fusszeile ("11 22 33 ... - 7"); {spec} steht fuer excel.register.spec_muster. Sonst zaehlt eine einzige
  # im PDF genannte Spec, die es in der CDE gibt. Enthaelt die CDE mehrere Specs, werden nur die Zeilen dieser Spec benutzt.
  spec_pdf_muster: ['^SECTION\s+{spec}', '^{spec}\b.*-\s*\d+\s*$']
  # Ohne Angabe des PDF-Lesers (PdfBlock.fortsetzung) raten, ob ein Absatz ueber den Seitenumbruch weitergeht: letzter Block
  # einer Seite ohne Satzende + erster Block der naechsten Seite = "moeglich" (verbunden nur, wenn A1 es bestaetigt; ganz
  # neuer Text danach -> fortsetzung_unklar, nie automatisch). Wird nur benutzt, wenn KEIN Block eine Angabe hat. Aus, seit der
  # PDF-Leser die Angabe selbst macht ("sicher" | "moeglich"); nur fuer aeltere Leser gedacht.
  fortsetzung_raten: false
  # Neuer Text ohne Satzende unten auf der Seite, danach bis zur naechsten Seite hoechstens so viele unveraenderte Woerter (z. B.
  # eine Fussnote) und keine sichere Fortsetzung: der Absatz geht vielleicht weiter -> fortsetzung_unklar (nie automatisch)
  seitenende_rest_woerter: 25
  satzende_zeichen: ".!?:;"
  doppelt_min_woerter: 3      # Ab so vielen Woertern gilt "gleicher Absatz steht schon" als sicher (nicht uebernommen); kuerzer = nur Vorschlag

# --- Schema 2: bisher im Code fest eingebaute Werte (Verhalten unveraendert; werden von K-XL / K-PL verdrahtet) ---
matcher:                      # Bewertung eines Treffers (src/matcher.py)
  gewicht_abdeckung: 0.9      # score = gewicht_abdeckung * Abdeckung + gewicht_dice * Dice
  gewicht_dice: 0.1
  section_bonus: 0.03         # Zuschlag, wenn die Section-Nummer passt
  untergrenze: 0.4            # darunter gibt es keinen Treffer, auch keinen Vorschlag
  max_kandidaten_section: 400 # so viele Kandidaten derselben Section werden zusaetzlich geprueft
  excel_abdeckung_min: 0.75   # deckt der PDF-Text weniger als so viel vom Excel-Absatz ab (Rest >= rest_min_woerter), nur "mittel"
  section_unpassend_stufe: mittel   # Stufe, wenn PDF-Section (alte Nummer) und Excel-Section beide bekannt sind und nicht passen (hoch | mittel)
  rest_min_woerter: 5         # so viele Woerter des Excel-Absatzes muessen unabgedeckt sein, damit der Anfangs-Treffer zaehlt
  teil_min_woerter: 3         # ExaktIndex: Teilstueck eines laengeren Excel-Absatzes (Seitenumbruch) erst ab so vielen Woertern
anwenden:                     # Schreiben in die Excel (src/applier.py)
  # ADR 0007: patch = verlustfrei (Kopie des Original-ZIP, nur geaenderte Teile neu: Bilder, Formen, Kennzeichnung,
  # Druckereinstellungen bleiben); openpyxl = frueheres Speichern (nur alte Tests/Notfaelle, kann Teile verlieren)
  schreiber: patch            # patch | openpyxl
  markierung_farbe: FFF2CC    # Hintergrund, wenn markierung.geaenderte_zellen = gelb (nur Schreiber openpyxl)
  kommentar_autor: CDE-Tool   # Autor der Zellkommentare, wenn markierung.geaenderte_zellen = kommentar
  gegenprobe_pflicht: true    # ADR 0004 Invariante: automatische Text-Aenderung ohne PDF-Absatz (plan.absaetze) -> "pruefen"
                              # (Code ohne_absatz). Neue Absaetze in einer Zelle und neue Zeilen sind ausgenommen.

# --- Schema 3 / ADR 0004: Gegenprobe ---------------------------------------------------------------
normalform:                   # Vergleichsform "streng, aber fair" (src/gegenprobe.py): Gross/Klein und Satzzeichen zaehlen
  # Zeichen, die beim Vergleich ganz wegfallen: weiches Trennzeichen, Nullbreiten, Hochzahlen (Fussnoten-Marken)
  entfernen: ["­", "​", "‌", "‍", "⁠", "﻿",
              "¹", "⁰", "⁴", "⁵", "⁶", "⁷", "⁸", "⁹"]
  # Varianten, die als gleich gelten (Anfuehrungszeichen, Striche)
  ersetzen: {"„": "\"", "“": "\"", "”": "\"", "«": "\"", "»": "\"",
             "‚": "'", "‘": "'", "’": "'", "‹": "'", "›": "'",
             "‐": "-", "‑": "-", "‒": "-", "–": "-", "—": "-", "―": "-", "−": "-",
             "²": "2", "³": "3"}   # Einheiten (mm², m³): gleich "mm2"/"m3" (der Leser liefert mm2, die Excel hat beides)
  leerraum: [" ", " ", " ", " ", "\t", "\n", "\r"]   # zaehlen als ein Leerzeichen
  kein_leerzeichen_vor: ".,;:!?)]}"
  kein_leerzeichen_nach: "([{"
  listenzeichen: ["•", "·", "▪", "◦", "‣", "-", "*"]   # optionales Aufzaehlungszeichen am Absatzanfang

neue_zeile:                   # neue Zeile "wie ein Mensch" aus der Vorlagezeile (Nachbarzeile gleichen Typs), Schreiber patch
  # Kopiert werden nur Kennungen LINKS der Section-/Textspalte (z. B. Spezifikation, Revision, Datum), deren Wert in mindestens
  # konstanten_anteil der Zeilen derselben Spezifikation gleich ist (eine CDE kann mehrere Specs enthalten: die Spec-Spalte ist
  # die erste Spalte links, deren Wert die Ankerzeile mit ihrer Nachbarzeile teilt; gezaehlt wird im zusammenhaengenden Block
  # mit diesem Wert). Die Vorlagezeile kommt aus derselben Spec. Rechts der Textspalte bleibt alles leer (mit Hinweis).
  konstanten_kopieren: true   # (Entscheidung Nico)
  konstanten_anteil: 0.9      # Anteil der Zeilen der Spec mit demselben Wert
  konstanten_nur_links: true  # rechts der Textspalte nichts kopieren (Status, Bewertungen, Bemerkungen ...)
  formeln_uebertragen: true   # in den Nachbarzeilen gleich gebaute Formeln (berechnete Spalten) in die neue Zeile uebertragen
  nur_text_rot: true          # Section, Sub-Section und Kennwort im Stil der Vorlage; nur der Text (und Titel) ist rot
zeilen:
  # Bereiche (Formeln, Namen), die genau mit der Vorlagezeile enden, wachsen um eine neue Zeile direkt dahinter (mit Hinweis).
  # Bedingte Formatierung, Datenpruefung, Autofilter und Druckbereich wachsen so immer (die neue Zeile sieht aus wie die Vorlage).
  listen_summen_erweitern: true
